name: Render Backend Keep-Alive Cron

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier 15-minute sleep
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL || 'https://couplesync-api.onrender.com' }}"
          echo "Pinging $URL/health ..."
          curl -s -f "$URL/health" || curl -s -f "$URL/api/health" || echo "Keep-alive ping completed"
